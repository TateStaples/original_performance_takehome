[package]
name = "perf_harness"
version = "0.1.0"
edition = "2021"

[lib]
name = "perf_harness"
path = "src/lib.rs"

[[bin]]
name = "gen_kernel"
path = "src/bin/gen_kernel.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
