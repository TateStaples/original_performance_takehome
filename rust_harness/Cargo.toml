[package]
name = "perf_harness"
version = "0.1.0"
edition = "2021"

[lib]
name = "perf_harness"
path = "src/lib.rs"

[[bin]]
name = "gen_kernel"
path = "src/bin/gen_kernel.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[[bin]]
name = "stats"
path = "src/bin/stats.rs"

[[bin]]
name = "lower_bound"
path = "src/bin/lower_bound.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3

[[bin]]
name = "frontier"
path = "src/bin/frontier.rs"
